server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls לבאקאנד
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy תמונות מוצרים
    location /productsImages/ {
        proxy_pass http://api:8080/productsImages/;
        proxy_set_header Host $host;
    }
}
