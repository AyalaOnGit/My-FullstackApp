@if (totalPages >= 1) {

  <div class="pagination-container flex flex-column align-items-center gap-2">
    <div class="pagination-controls shadow-2 border-round-pill p-2 flex align-items-center justify-content-center gap-3">
      
      <p-button 
        icon="pi pi-angle-double-right" 
        [disabled]="currentPage === 1" 
        (click)="goToPage(1)"
        styleClass="p-button-rounded p-button-text p-button-secondary">
      </p-button>

      <p-button 
        label="הקודם"
        icon="pi pi-chevron-right" 
        [disabled]="currentPage === 1" 
        (click)="goToPage(currentPage - 1)"
        styleClass="p-button-rounded p-button-text font-bold">
      </p-button>

      <div class="page-display flex align-items-center gap-2 px-3">
        <span class="current-page text-primary font-bold text-xl">{{currentPage}}</span>
        <span class="divider text-400">/</span>
        <span class="total-pages font-medium text-700">{{totalPages}}</span>
      </div>

      <p-button 
        label="הבא"
        icon="pi pi-chevron-left" 
        iconPos="right"
        [disabled]="currentPage === totalPages" 
        (click)="goToPage(currentPage + 1)"
        styleClass="p-button-rounded p-button-text font-bold">
      </p-button>

      <p-button 
        icon="pi pi-angle-double-left" 
        [disabled]="currentPage === totalPages" 
        (click)="goToPage(totalPages)"
        styleClass="p-button-rounded p-button-text p-button-secondary">
      </p-button>

    </div>
    
    <!-- <small class="text-500 font-italic">מציג דף {{currentPage}} מתוך {{totalPages}}</small> -->
  </div>
}
